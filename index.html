<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול קשרים – מכון משפטי ארץ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- כניסה -->
  <section id="loginView" class="hidden">
    <div class="card narrow">
      <h1>כניסת צוות</h1>
      <p class="muted">מערכת ניהול הקשרים של מכון משפטי ארץ</p>
      <button class="primary" id="btnGoogle" style="width:100%;padding:11px">כניסה עם חשבון Google</button>
      <p class="small muted" style="margin-top:14px">הכניסה מותרת רק לכתובות שמנהל המערכת אישר.</p>
    </div>
  </section>

  <!-- חשבון לא מורשה -->
  <section id="pendingView" class="hidden">
    <div class="card narrow">
      <h2>אין הרשאת גישה</h2>
      <p>החשבון <b id="deniedEmail"></b> לא נמצא ברשימת המשתמשים המורשים.</p>
      <p class="muted">אם אתה אמור לקבל גישה, בקש ממנהל המערכת להוסיף את הכתובת הזו. אם נכנסת בטעות עם חשבון אחר, צא ונסה שוב.</p>
      <button id="btnLogoutPending">יציאה והחלפת חשבון</button>
    </div>
  </section>

  <!-- המערכת -->
  <section id="appView" class="hidden">
    <header class="topbar">
      <span class="logo">משפטי ארץ</span>
      <nav id="nav">
        <button data-view="dashboard">ראשי</button>
        <button data-view="contacts">אנשי קשר</button>
        <button data-view="questions">שו"ת</button>
        <button data-view="import" data-roles="admin,head,staff">ייבוא</button>
        <button data-view="users" data-roles="admin">משתמשים</button>
      </nav>
      <span class="who"><span id="whoName"></span><button id="btnLogout">יציאה</button></span>
    </header>
    <main id="main"></main>
  </section>

  <div id="setupView"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
