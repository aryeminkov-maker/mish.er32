<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול קשרים – מכון משפטי ארץ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- כניסה -->
  <section id="loginView" class="hidden">
    <div class="card narrow">
      <h1>כניסת צוות</h1>
      <p class="muted">מערכת ניהול הקשרים של מכון משפטי ארץ</p>
      <div id="loginForm">
        <div class="field"><label>מייל</label><input id="loginEmail" type="email" autocomplete="email"></div>
        <div class="field"><label>סיסמה</label><input id="loginPass" type="password" autocomplete="current-password"></div>
        <div class="row space">
          <button class="primary" id="btnLogin">כניסה</button>
          <button class="link" id="btnForgot">שכחתי סיסמה</button>
        </div>
        <p class="small muted" style="margin-top:16px">אין לך חשבון? <button class="link" id="showRegister">הרשמה לצוות</button></p>
      </div>
      <div id="registerForm" class="hidden">
        <div class="field"><label>שם מלא</label><input id="regName"></div>
        <div class="field"><label>מייל</label><input id="regEmail" type="email"></div>
        <div class="field"><label>סיסמה (לפחות 6 תווים)</label><input id="regPass" type="password"></div>
        <div class="row space">
          <button class="primary" id="btnRegister">הרשמה</button>
          <button class="link" id="showLogin">חזרה לכניסה</button>
        </div>
        <p class="small muted" style="margin-top:12px">אחרי ההרשמה מנהל המערכת צריך לאשר את החשבון ולהגדיר תפקיד.</p>
      </div>
    </div>
  </section>

  <!-- ממתין לאישור -->
  <section id="pendingView" class="hidden">
    <div class="card narrow">
      <h2>החשבון ממתין לאישור</h2>
      <p>נרשמת בהצלחה. מנהל המערכת צריך לאשר את החשבון ולהגדיר לך תפקיד. אחרי האישור רענן את הדף.</p>
      <button id="btnLogoutPending">יציאה</button>
    </div>
  </section>

  <!-- המערכת -->
  <section id="appView" class="hidden">
    <header class="topbar">
      <span class="logo">משפטי ארץ</span>
      <nav id="nav">
        <button data-view="dashboard">ראשי</button>
        <button data-view="contacts">אנשי קשר</button>
        <button data-view="questions">שו"ת</button>
        <button data-view="import" data-roles="admin,head,staff">ייבוא</button>
        <button data-view="users" data-roles="admin">משתמשים</button>
      </nav>
      <span class="who"><span id="whoName"></span><button id="btnLogout">יציאה</button></span>
    </header>
    <main id="main"></main>
  </section>

  <div id="setupView"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
