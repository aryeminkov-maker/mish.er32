<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאל את הרב – מכון משפטי ארץ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta name="theme-color" content="#c19937">
  <link rel="stylesheet" href="css/style.css?v=20261015">
</head>
<body>
  <header class="public-head">
    <picture><source srcset="img/logo-light.png" media="(prefers-color-scheme: dark)"><img src="img/logo.png" class="logo-img" width="140" height="48" alt="מכון משפטי ארץ"></picture>
    <h1>שאל את הרב</h1>
  </header>
  <main>
    <div id="setupView"></div>
    <div class="card medium" id="formCard">
      <form id="askForm">
        <div class="grid2">
          <div class="field"><label>שם פרטי *</label><input id="firstName" required maxlength="60"></div>
          <div class="field"><label>שם משפחה</label><input id="lastName" maxlength="60"></div>
          <div class="field"><label>מייל *</label><input id="email" type="email" required maxlength="120"></div>
          <div class="field"><label>טלפון</label><input id="phone" type="tel" maxlength="20"></div>
        </div>
        <div class="field"><label>נושא</label><select id="topic"></select></div>
        <div class="field"><label>השאלה *</label><textarea id="text" required maxlength="5000" style="min-height:160px"></textarea></div>
        <label class="check"><input type="checkbox" id="consent"> אני מאשר/ת לקבל עדכונים מהמכון במייל (אפשר להסיר בכל עת)</label>
        <p class="small muted">פרטיך ישמשו לצורך מענה לשאלה. שאלות עשויות להתפרסם במאגר השו"ת בעילום שם.</p>
        <button class="primary" type="submit" id="send">שליחת השאלה</button>
      </form>
    </div>
    <div class="card medium hidden" id="thanks">
      <h2>השאלה התקבלה, תודה!</h2>
      <p>התשובה תישלח אליך למייל. בינתיים אפשר לעיין ב<a href="shut.html">מאגר השו"ת</a>.</p>
      <button onclick="location.reload()">שאלה נוספת</button>
    </div>
  </main>
  <script type="module" src="js/ask.js?v=20261015"></script>
</body>
</html>
